<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>pgchat — natural language SQL console</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{

    /* ---- ink ---- */
    --ink:#0a0e14;
    --ink-soft:#0e141c;

    --panel:rgba(16,22,31,.86);
    --panel-2:rgba(21,28,39,.82);

    --line:rgba(184,201,224,.09);
    --line-soft:rgba(184,201,224,.045);

    --text:#e9edf4;
    --muted:#8a97a8;
    --faint:#4c5764;

    /* ---- accents, grounded in query-plan / index colouring ---- */
    --gold:#c99a52;      /* cost / active query */
    --gold-soft:#e6bd7d;
    --teal:#5cb8a4;      /* index / connected */
    --red:#ff7a70;       /* seq scan / error */

    --shadow:
        0 30px 90px rgba(0,0,0,.6),
        0 0 100px rgba(201,154,82,.035);

    --radius-lg:12px;
    --radius-md:9px;
    --radius-sm:6px;
}


/* =========================
   RESET
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{

    font-family:"Inter",sans-serif;

    background:
        radial-gradient(circle at 15% -5%, rgba(201,154,82,.07), transparent 32%),
        radial-gradient(circle at 92% 96%, rgba(92,184,164,.06), transparent 38%),
        var(--ink);

    color:var(--text);

    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:25px;

    overflow:hidden;
}


/* =========================
   BACKGROUND — faint relation grid
========================= */

.background-grid{

    position:fixed;
    inset:0;
    pointer-events:none;

    background-image:
        linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px);

    background-size:46px 46px;

    mask-image:radial-gradient(ellipse at center, black 18%, transparent 75%);

    animation:gridMove 28s linear infinite;
}

@keyframes gridMove{
    from{ transform:translateY(0); }
    to{ transform:translateY(46px); }
}

.orb{
    position:fixed;
    width:300px;
    height:300px;
    border-radius:50%;
    filter:blur(110px);
    opacity:.10;
    pointer-events:none;
}

.orb.one{
    background:#c99a52;
    top:-140px;
    left:-110px;
    animation:orbOne 13s ease-in-out infinite alternate;
}

.orb.two{
    background:#5cb8a4;
    right:-140px;
    bottom:-110px;
    animation:orbTwo 16s ease-in-out infinite alternate;
}

@keyframes orbOne{
    from{ transform:translate(0,0); }
    to{ transform:translate(90px,60px); }
}

@keyframes orbTwo{
    from{ transform:translate(0,0); }
    to{ transform:translate(-90px,-70px); }
}


/* =========================
   MAIN CONSOLE
========================= */

.console{

    position:relative;

    width:100%;
    max-width:1050px;

    height:min(760px,92vh);

    display:flex;
    flex-direction:column;

    background:var(--panel);

    border:1px solid var(--line);

    border-radius:var(--radius-lg);

    backdrop-filter:blur(25px);

    box-shadow:var(--shadow);

    overflow:hidden;

    animation:consoleEnter .8s cubic-bezier(.16,1,.3,1);

}

.console::before{

    content:"";
    position:absolute;
    inset:-1px;
    border-radius:inherit;
    padding:1px;

    background:linear-gradient(
        120deg,
        transparent,
        rgba(201,154,82,.3),
        transparent,
        rgba(92,184,164,.18),
        transparent
    );

    background-size:300% 300%;
    animation:borderFlow 9s linear infinite;
    pointer-events:none;

    mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite:exclude;
}

@keyframes borderFlow{
    0%{ background-position:0% 50%; }
    50%{ background-position:100% 50%; }
    100%{ background-position:0% 50%; }
}

@keyframes consoleEnter{
    from{ opacity:0; transform:translateY(28px) scale(.97); filter:blur(8px); }
    to{ opacity:1; transform:translateY(0) scale(1); filter:blur(0); }
}


/* =========================
   HEADER
========================= */

.titlebar{

    height:64px;

    display:flex;
    align-items:center;

    padding:0 20px;

    background:rgba(255,255,255,.02);

    border-bottom:1px solid var(--line);

    flex-shrink:0;

    position:relative;
    z-index:2;
}

.dots{
    display:flex;
    gap:8px;
    margin-right:16px;
}

.dots span{
    width:10px;
    height:10px;
    border-radius:50%;
    transition:transform .2s;
}

.dots span:hover{
    transform:scale(1.3);
}

.dots .r{ background:#c9524a; }
.dots .y{ background:#c99a52; }
.dots .g{ background:#5cb8a4; }


.logo{
    display:flex;
    align-items:center;
    gap:11px;
}

.logo-icon{

    width:32px;
    height:32px;

    display:grid;
    place-items:center;

    border-radius:8px;

    background:linear-gradient(145deg, rgba(201,154,82,.2), rgba(201,154,82,.04));

    border:1px solid rgba(201,154,82,.25);

    color:var(--gold-soft);

    font-family:"JetBrains Mono";
    font-weight:800;
    font-size:13px;

    animation:logoPulse 3.4s ease-in-out infinite;
}

@keyframes logoPulse{
    0%,100%{ box-shadow:0 0 14px rgba(201,154,82,.04); }
    50%{ box-shadow:0 0 22px rgba(201,154,82,.18); }
}

.title-meta{
    display:flex;
    flex-direction:column;
    gap:2px;
}

.name{
    font-family:"JetBrains Mono";
    font-weight:700;
    font-size:14px;
    letter-spacing:.2px;
}

.sub{
    color:var(--faint);
    font-size:10px;
    font-family:"JetBrains Mono";
}


.header-right{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:16px;
}

.conn-string{
    font-family:"JetBrains Mono";
    font-size:10px;
    color:var(--faint);
    display:flex;
    align-items:center;
    gap:6px;
}

.conn-string b{
    color:var(--muted);
    font-weight:500;
}

.latency{
    font-family:"JetBrains Mono";
    font-size:10px;
    color:var(--faint);
    min-width:44px;
    text-align:right;
}

.status{
    display:flex;
    align-items:center;
    gap:7px;

    font-family:"JetBrains Mono";
    font-size:10px;
    color:var(--teal);

    padding:6px 10px;
    border-radius:20px;

    background:rgba(92,184,164,.06);
    border:1px solid rgba(92,184,164,.15);
}

.status-dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--teal);
    box-shadow:0 0 0 0 rgba(92,184,164,.5);
    animation:statusPulse 2.2s infinite;
}

@keyframes statusPulse{
    0%{ box-shadow:0 0 0 0 rgba(92,184,164,.5); }
    70%{ box-shadow:0 0 0 7px rgba(92,184,164,0); }
    100%{ box-shadow:0 0 0 0 rgba(92,184,164,0); }
}


/* =========================
   CHAT
========================= */

#chat-box{
    flex:1;
    overflow-y:auto;
    padding:26px;
    display:flex;
    flex-direction:column;
    gap:20px;
    scroll-behavior:smooth;
}

#chat-box::-webkit-scrollbar{ width:6px; }

#chat-box::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,.08);
    border-radius:20px;
}

#chat-box::-webkit-scrollbar-thumb:hover{
    background:rgba(201,154,82,.3);
}


/* =========================
   MESSAGE
========================= */

.row{
    max-width:88%;
    display:flex;
    flex-direction:column;
    animation:messageEnter .5s cubic-bezier(.16,1,.3,1);
}

@keyframes messageEnter{
    from{ opacity:0; transform:translateY(14px) scale(.98); filter:blur(4px); }
    to{ opacity:1; transform:translateY(0) scale(1); filter:blur(0); }
}

.row.user{ align-self:flex-end; align-items:flex-end; }
.row.bot{ align-self:flex-start; align-items:flex-start; }


.label{
    display:flex;
    align-items:baseline;
    gap:8px;

    font-family:"JetBrains Mono";
    font-size:10px;

    margin-bottom:6px;
    padding:0 3px;
}

.row.user .label .who{ color:var(--gold-soft); }
.row.bot .label .who{ color:var(--teal); }

.label .who{ font-weight:600; }
.label .time{ color:var(--faint); }


.bubble{
    padding:12px 15px;
    border-radius:var(--radius-md);
    line-height:1.6;
    font-size:13.5px;
    white-space:pre-wrap;
    word-break:break-word;
    position:relative;
    overflow:hidden;
}

.row.user .bubble{

    background:linear-gradient(135deg, rgba(201,154,82,.16), rgba(201,154,82,.06));
    border:1px solid rgba(201,154,82,.2);
    color:#f2ddb8;

    font-family:"JetBrains Mono";
    font-size:12px;

    border-bottom-right-radius:3px;
}

.row.user .bubble::before{
    content:"> ";
    color:var(--gold-soft);
    font-weight:bold;
}

.row.bot .bubble{

    background:linear-gradient(135deg, rgba(255,255,255,.04), rgba(255,255,255,.016));
    border:1px solid var(--line);
    color:var(--text);

    border-top-left-radius:3px;
}


/* =========================
   WELCOME — terminal-style splash
========================= */

.welcome{
    margin:auto;
    width:100%;
    max-width:520px;
    animation:welcomeIn 1s cubic-bezier(.16,1,.3,1);
}

@keyframes welcomeIn{
    from{ opacity:0; transform:translateY(18px); }
    to{ opacity:1; transform:translateY(0); }
}

.welcome-head{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:22px;
}

.welcome-mark{
    width:46px;
    height:46px;
    flex-shrink:0;

    display:grid;
    place-items:center;

    border-radius:12px;
    border:1px solid rgba(201,154,82,.22);
    background:rgba(201,154,82,.05);

    animation:welcomeFloat 4.2s ease-in-out infinite;
}

@keyframes welcomeFloat{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-6px); }
}

.welcome h2{
    font-family:"JetBrains Mono";
    font-size:20px;
    font-weight:700;
    letter-spacing:-.2px;
}

.welcome p{
    color:var(--muted);
    font-size:12.5px;
    margin-top:3px;
}

.schema{
    border:1px solid var(--line);
    border-radius:var(--radius-md);
    background:rgba(255,255,255,.015);
    overflow:hidden;
}

.schema-head{
    padding:9px 13px;
    font-family:"JetBrains Mono";
    font-size:10px;
    color:var(--faint);
    border-bottom:1px solid var(--line);
    background:rgba(255,255,255,.015);
}

.query-chip{
    width:100%;
    text-align:left;

    display:flex;
    align-items:center;
    gap:10px;

    padding:11px 13px;

    background:transparent;
    border:none;
    border-bottom:1px solid var(--line-soft);

    color:var(--muted);

    font-family:"JetBrains Mono";
    font-size:11.5px;

    cursor:pointer;
    transition:background .18s, color .18s, padding-left .18s;
}

.query-chip:last-child{ border-bottom:none; }

.query-chip:hover{
    background:rgba(201,154,82,.05);
    color:var(--gold-soft);
    padding-left:17px;
}

.query-chip .glyph{
    color:var(--faint);
    flex-shrink:0;
}

.query-chip:hover .glyph{
    color:var(--gold-soft);
}


/* =========================
   THINKING
========================= */

.thinking{
    display:flex;
    flex-direction:column;
    gap:11px;

    min-width:250px;
    max-width:100%;

    padding:13px 16px;

    background:rgba(255,255,255,.03);
    border:1px solid var(--line);
    border-radius:var(--radius-md);
    border-top-left-radius:3px;
}

.think-row1{
    display:flex;
    align-items:center;
    gap:10px;
}

.think-ring{
    width:13px;
    height:13px;
    flex-shrink:0;
    border-radius:50%;

    border:2px solid rgba(255,255,255,.09);
    border-top-color:var(--gold-soft);
    border-right-color:var(--teal);

    animation:ringSpin .85s linear infinite;
}

@keyframes ringSpin{
    to{ transform:rotate(360deg); }
}

.think-label{
    position:relative;

    font-family:"JetBrains Mono";
    font-size:11px;
    letter-spacing:.1px;

    background:linear-gradient(
        100deg,
        var(--muted) 30%,
        var(--gold-soft) 48%,
        var(--teal) 56%,
        var(--muted) 74%
    );

    background-size:220% 100%;

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;

    animation:shimmer 1.8s linear infinite;
}

.think-label.pulse{
    animation:shimmer 1.8s linear infinite, stageFade .35s ease;
}

@keyframes shimmer{
    0%{ background-position:220% 0; }
    100%{ background-position:-40% 0; }
}

@keyframes stageFade{
    from{ opacity:0; transform:translateY(3px); }
    to{ opacity:1; transform:translateY(0); }
}

.think-sql{
    padding-left:23px;

    font-family:"JetBrains Mono";
    font-size:11px;
    color:var(--faint);

    white-space:pre;
    min-height:14px;
}

.think-sql .cursor{
    display:inline-block;
    width:6px;
    height:12px;
    margin-left:2px;
    vertical-align:-2px;
    background:var(--gold-soft);
    animation:cursorBlink 1s step-end infinite;
}


/* =========================
   TABLE
========================= */

.table-wrap{
    width:100%;
    min-width:500px;
    overflow:hidden;
    border-radius:var(--radius-md);
    border:1px solid var(--line);
    background:rgba(8,11,16,.6);
    box-shadow:0 15px 40px rgba(0,0,0,.2);
    animation:tableAppear .55s cubic-bezier(.16,1,.3,1);
}

@keyframes tableAppear{
    from{ opacity:0; transform:translateY(10px) scale(.98); }
    to{ opacity:1; transform:translateY(0) scale(1); }
}

.table-header{
    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:9px 12px;

    background:rgba(255,255,255,.03);
    border-bottom:1px solid var(--line);

    font-family:"JetBrains Mono";
    font-size:10px;
    color:var(--muted);
}

.table-header-left{
    display:flex;
    align-items:center;
    gap:8px;
}

.table-icon{
    width:6px;
    height:6px;
    border-radius:2px;
    background:var(--teal);
}

.row-count{
    color:var(--faint);
}

.copy-btn{
    border:1px solid var(--line);
    background:transparent;
    color:var(--muted);

    padding:4px 9px;
    border-radius:var(--radius-sm);

    font-family:"JetBrains Mono";
    font-size:9px;

    cursor:pointer;
    transition:.2s;
}

.copy-btn:hover{
    color:var(--gold-soft);
    border-color:rgba(201,154,82,.3);
    background:rgba(201,154,82,.05);
}

.table-scroll{
    overflow:auto;
    max-height:300px;
}

table{
    width:100%;
    border-collapse:collapse;
    font-family:"JetBrains Mono";
    font-size:11px;
}

thead th{
    text-align:left;
    padding:9px 12px;

    background:rgba(255,255,255,.02);
    color:var(--faint);
    font-weight:500;

    border-bottom:1px solid var(--line);

    position:sticky;
    top:0;
    backdrop-filter:blur(10px);
}

tbody td{
    padding:9px 12px;
    color:var(--text);
    border-bottom:1px solid var(--line-soft);
    white-space:nowrap;
}

tbody tr{
    transition:background .2s;
}

tbody tr:nth-child(even){
    background:rgba(255,255,255,.012);
}

tbody tr:hover{
    background:rgba(201,154,82,.05);
}

tbody tr{
    animation:rowReveal .32s ease both;
}

@keyframes rowReveal{
    from{ opacity:0; transform:translateX(-6px); }
    to{ opacity:1; transform:translateX(0); }
}


/* =========================
   INPUT AREA
========================= */

.input-container{
    padding:14px 18px 17px;
    background:rgba(255,255,255,.02);
    border-top:1px solid var(--line);
    flex-shrink:0;
}

.input-area{
    display:flex;
    align-items:center;
    gap:10px;

    padding:4px 5px 4px 13px;

    border:1px solid var(--line);
    border-radius:var(--radius-md);
    background:rgba(0,0,0,.2);

    transition:border-color .25s, box-shadow .25s, background .25s;
}

.input-area:focus-within{
    border-color:rgba(201,154,82,.35);
    background:rgba(201,154,82,.02);
    box-shadow:0 0 0 3px rgba(201,154,82,.05), 0 0 30px rgba(201,154,82,.05);
}

.prompt-glyph{
    font-family:"JetBrains Mono";
    color:var(--gold-soft);
    font-size:15px;
    position:relative;
}

.prompt-glyph::after{
    content:"";
    display:inline-block;
    width:6px;
    height:13px;
    margin-left:4px;
    background:var(--gold-soft);
    vertical-align:-2px;
    animation:cursorBlink 1.1s step-end infinite;
}

@keyframes cursorBlink{
    0%,49%{ opacity:1; }
    50%,100%{ opacity:0; }
}

#query{
    flex:1;
    min-width:0;

    background:transparent;
    border:none;
    outline:none;

    color:var(--text);
    font-family:"JetBrains Mono";
    font-size:12px;
    padding:10px 0;
}

#query::placeholder{ color:var(--faint); }


#send-btn{
    position:relative;
    overflow:hidden;

    border:1px solid rgba(201,154,82,.35);
    border-radius:var(--radius-sm);
    padding:9px 16px;

    background:rgba(201,154,82,.08);
    color:var(--gold-soft);

    font-family:"JetBrains Mono";
    font-size:10px;
    font-weight:600;

    cursor:pointer;
    transition:transform .2s, background .2s, color .2s, box-shadow .2s;
}

#send-btn:hover:not(:disabled){
    transform:translateY(-2px);
    background:var(--gold);
    color:#171006;
    box-shadow:0 8px 25px rgba(201,154,82,.2);
}

#send-btn:active:not(:disabled){
    transform:translateY(0) scale(.96);
}

#send-btn:disabled{
    opacity:.4;
    cursor:not-allowed;
}


.input-footer{
    display:flex;
    justify-content:space-between;

    margin-top:7px;
    padding:0 4px;

    color:var(--faint);
    font-family:"JetBrains Mono";
    font-size:8px;
}

.input-footer span{
    display:flex;
    align-items:center;
    gap:5px;
}


/* =========================
   ERROR
========================= */

.error-message{
    border-color:rgba(255,122,112,.25) !important;
    animation:errorShake .4s ease;
}

@keyframes errorShake{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-5px); }
    75%{ transform:translateX(5px); }
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    body{ padding:0; }

    .console{
        height:100vh;
        max-width:none;
        border-radius:0;
        border:none;
    }

    .latency,
    .conn-string,
    .sub{ display:none; }

    #chat-box{ padding:18px; }

    .row{ max-width:94%; }

    .table-wrap{ min-width:0; max-width:100%; }

    .welcome h2{ font-size:18px; }

    .input-container{ padding:10px; }

}


/* =========================
   REDUCED MOTION
========================= */

@media(prefers-reduced-motion:reduce){

    *, *::before, *::after{
        animation:none !important;
        transition:none !important;
        scroll-behavior:auto !important;
    }

}

</style>

</head>


<body>


<div class="background-grid"></div>

<div class="orb one"></div>
<div class="orb two"></div>


<div class="console">


    <!-- HEADER -->

    <div class="titlebar">

        <div class="dots">
            <span class="r"></span>
            <span class="y"></span>
            <span class="g"></span>
        </div>

        <div class="logo">

            <div class="logo-icon">DB</div>

            <div class="title-meta">
                <span class="name">pgchat</span>
                <span class="sub">english in, sql out</span>
            </div>

        </div>

        <div class="header-right">

            <span class="conn-string">postgres@<b>localhost:5432</b></span>

            <span class="latency" id="latency">ready</span>

            <div class="status">
                <span class="status-dot"></span>
                <span id="statusText">connected</span>
            </div>

        </div>

    </div>


    <!-- CHAT -->

    <div id="chat-box">

        <div class="welcome" id="welcome">

            <div class="welcome-head">

                <div class="welcome-mark">
                    <span class="table-icon" style="width:8px;height:8px;"></span>
                </div>

                <div>
                    <h2>ask your database anything</h2>
                    <p>plain English gets translated to SQL and run against your tables.</p>
                </div>

            </div>

            <div class="schema">

                <div class="schema-head">try one of these</div>

                <button class="query-chip" onclick="useSuggestion('get all students')">
                    <span class="glyph">›</span> get all students
                </button>

                <button class="query-chip" onclick="useSuggestion('show students older than 18')">
                    <span class="glyph">›</span> show students older than 18
                </button>

                <button class="query-chip" onclick="useSuggestion('count all students')">
                    <span class="glyph">›</span> count all students
                </button>

                <button class="query-chip" onclick="useSuggestion('show all branches')">
                    <span class="glyph">›</span> show all branches
                </button>

            </div>

        </div>

    </div>


    <!-- INPUT -->

    <div class="input-container">

        <div class="input-area">

            <span class="prompt-glyph">›</span>

            <input
                type="text"
                id="query"
                placeholder="ask a question..."
                autocomplete="off"
                maxlength="500"
            >

            <button id="send-btn">run</button>

        </div>

        <div class="input-footer">
            <span><span>↵</span> enter to run</span>
            <span id="charCount">0 / 500</span>
        </div>

    </div>


</div>



<script>


/* =====================================================
   ELEMENTS
===================================================== */

const queryInput = document.getElementById("query");
const sendButton = document.getElementById("send-btn");
const chatBox = document.getElementById("chat-box");
const latencyElement = document.getElementById("latency");
const statusText = document.getElementById("statusText");
const charCount = document.getElementById("charCount");
const welcome = document.getElementById("welcome");


/* =====================================================
   TIME
===================================================== */

function timeNow(){

    return new Date().toLocaleTimeString(
        [],
        { hour:"2-digit", minute:"2-digit" }
    );

}


/* =====================================================
   HIDE WELCOME
===================================================== */

function hideWelcome(){

    if(welcome){

        welcome.style.opacity = "0";
        welcome.style.transform = "translateY(-10px) scale(.98)";
        welcome.style.pointerEvents = "none";

        setTimeout(() => welcome.remove(), 300);

    }

}


/* =====================================================
   LABEL BUILDER
===================================================== */

function buildLabel(type){

    const label = document.createElement("span");
    label.className = "label";

    const who = document.createElement("span");
    who.className = "who";
    who.textContent = type === "user" ? "you" : "pgchat";

    const time = document.createElement("span");
    time.className = "time";
    time.textContent = timeNow();

    label.appendChild(who);
    label.appendChild(time);

    return label;

}


/* =====================================================
   ADD MESSAGE
===================================================== */

function addMessage(message,type){

    hideWelcome();

    const row = document.createElement("div");
    row.className = `row ${type}`;

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = message;

    row.appendChild(buildLabel(type));
    row.appendChild(bubble);

    chatBox.appendChild(row);

    scrollToBottom();

}


/* =====================================================
   STREAM BOT MESSAGE
===================================================== */

async function streamMessage(message){

    hideWelcome();

    const row = document.createElement("div");
    row.className = "row bot";

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    row.appendChild(buildLabel("bot"));
    row.appendChild(bubble);

    chatBox.appendChild(row);

    let text = "";

    for(const char of message){

        text += char;
        bubble.textContent = text;

        scrollToBottom();

        await new Promise(resolve => setTimeout(resolve,8));

    }

}


/* =====================================================
   THINKING ANIMATION
===================================================== */

const thinkStages = [
    "reading schema",
    "planning query",
    "drafting sql",
    "optimizing",
    "executing"
];

const thinkSqlDrafts = [
    "select * from students",
    "select * from students where age > 18",
    "select branch, count(*) from students group by branch"
];

const thinkState = {
    active:false,
    stageTimer:null,
    stageIdx:0
};

function sleep(ms){
    return new Promise(resolve => setTimeout(resolve,ms));
}

function showTyping(){

    const row = document.createElement("div");
    row.className = "row bot";
    row.id = "typing-row";

    const label = document.createElement("span");
    label.className = "label";
    label.innerHTML = `<span class="who">pgchat</span><span class="time">running</span>`;

    const card = document.createElement("div");
    card.className = "thinking";

    card.innerHTML = `
        <div class="think-row1">
            <span class="think-ring"></span>
            <span class="think-label" id="thinkLabel">${thinkStages[0]}</span>
        </div>
        <div class="think-sql" id="thinkSql"></div>
    `;

    row.appendChild(label);
    row.appendChild(card);

    chatBox.appendChild(row);

    scrollToBottom();

    startThinkingAnimation();

}


function startThinkingAnimation(){

    thinkState.active = true;
    thinkState.stageIdx = 0;

    thinkState.stageTimer = setInterval(() => {

        thinkState.stageIdx = (thinkState.stageIdx + 1) % thinkStages.length;

        const el = document.getElementById("thinkLabel");

        if(el){

            el.textContent = thinkStages[thinkState.stageIdx];

            el.classList.remove("pulse");

            void el.offsetWidth;

            el.classList.add("pulse");

        }

    },1200);

    runSqlTypewriter();

}


async function runSqlTypewriter(){

    let draftIndex = 0;

    while(thinkState.active){

        const text = thinkSqlDrafts[draftIndex % thinkSqlDrafts.length];

        for(let c = 1; c <= text.length; c++){

            if(!thinkState.active) return;

            const el = document.getElementById("thinkSql");

            if(!el) return;

            el.innerHTML = `${escapeHTML(text.slice(0,c))}<span class="cursor"></span>`;

            await sleep(26);

        }

        await sleep(650);

        if(!thinkState.active) return;

        for(let c = text.length; c >= 0; c--){

            if(!thinkState.active) return;

            const el = document.getElementById("thinkSql");

            if(!el) return;

            el.innerHTML = `${escapeHTML(text.slice(0,c))}<span class="cursor"></span>`;

            await sleep(14);

        }

        await sleep(200);

        draftIndex++;

    }

}


/* =====================================================
   REMOVE TYPING
===================================================== */

function removeTyping(){

    thinkState.active = false;

    if(thinkState.stageTimer){

        clearInterval(thinkState.stageTimer);

        thinkState.stageTimer = null;

    }

    const typing = document.getElementById("typing-row");

    if(typing){

        typing.style.opacity = "0";
        typing.style.transform = "translateY(-5px)";

        setTimeout(() => typing.remove(), 150);

    }

}


/* =====================================================
   TABLE
===================================================== */

function createTable(students){

    hideWelcome();

    const row = document.createElement("div");
    row.className = "row bot";

    const wrap = document.createElement("div");
    wrap.className = "table-wrap";

    /* HEADER */

    const header = document.createElement("div");
    header.className = "table-header";

    const left = document.createElement("div");
    left.className = "table-header-left";

    const icon = document.createElement("div");
    icon.className = "table-icon";

    const title = document.createElement("span");
    title.textContent = "query result";

    left.appendChild(icon);
    left.appendChild(title);

    const right = document.createElement("div");
    right.style.display = "flex";
    right.style.alignItems = "center";
    right.style.gap = "8px";

    const count = document.createElement("span");
    count.className = "row-count";
    count.textContent = `${students.length} row${students.length === 1 ? "" : "s"}`;

    const copyButton = document.createElement("button");
    copyButton.className = "copy-btn";
    copyButton.textContent = "copy";
    copyButton.onclick = () => copyTable(students,copyButton);

    right.appendChild(count);
    right.appendChild(copyButton);

    header.appendChild(left);
    header.appendChild(right);

    /* TABLE */

    const scroll = document.createElement("div");
    scroll.className = "table-scroll";

    const table = document.createElement("table");

    table.innerHTML = `
        <thead>
            <tr>
                <th>id</th>
                <th>name</th>
                <th>age</th>
                <th>branch</th>
            </tr>
        </thead>
        <tbody></tbody>
    `;

    const tbody = table.querySelector("tbody");

    students.forEach((student,index) => {

        const tr = document.createElement("tr");
        tr.style.animationDelay = `${index * 45}ms`;

        tr.innerHTML = `
            <td>${escapeHTML(student.id)}</td>
            <td>${escapeHTML(student.name)}</td>
            <td>${escapeHTML(student.age)}</td>
            <td>${escapeHTML(student.branch)}</td>
        `;

        tbody.appendChild(tr);

    });

    scroll.appendChild(table);

    wrap.appendChild(header);
    wrap.appendChild(scroll);

    row.appendChild(buildLabel("bot"));
    row.appendChild(wrap);

    chatBox.appendChild(row);

    scrollToBottom();

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    const div = document.createElement("div");
    div.textContent = value ?? "";

    return div.innerHTML;

}


/* =====================================================
   COPY TABLE
===================================================== */

async function copyTable(students,button){

    const text = students.map(
        student => `${student.id}\t${student.name}\t${student.age}\t${student.branch}`
    ).join("\n");

    try{

        await navigator.clipboard.writeText(text);

        button.textContent = "copied ✓";

        setTimeout(() => { button.textContent = "copy"; }, 1500);

    }
    catch(error){

        button.textContent = "failed";

    }

}


/* =====================================================
   SCROLL
===================================================== */

function scrollToBottom(){

    requestAnimationFrame(() => {

        chatBox.scrollTo({
            top: chatBox.scrollHeight,
            behavior: "smooth"
        });

    });

}


/* =====================================================
   SUGGESTION
===================================================== */

function useSuggestion(text){

    queryInput.value = text;
    updateCounter();
    queryInput.focus();
    sendMessage();

}


/* =====================================================
   COUNTER
===================================================== */

function updateCounter(){

    charCount.textContent = `${queryInput.value.length} / 500`;

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

    const query = queryInput.value.trim();

    if(!query){
        queryInput.focus();
        return;
    }

    addMessage(query,"user");

    queryInput.value = "";
    updateCounter();

    sendButton.disabled = true;
    sendButton.textContent = "running";

    const startTime = performance.now();

    showTyping();

    statusText.textContent = "querying";
    statusText.parentElement.style.color = "var(--gold-soft)";

    try{

        const response = await fetch(
            `http://127.0.0.1:8000/predict?query=${encodeURIComponent(query)}`,
            { method:"POST" }
        );

        if(!response.ok){
            throw new Error(`Server returned ${response.status}`);
        }

        const data = await response.json();

        const endTime = performance.now();
        const elapsed = Math.round(endTime - startTime);

        latencyElement.textContent = `${elapsed} ms`;

        removeTyping();

        if(data.type === "table"){
            createTable(data.data);
        }
        else{
            await streamMessage(String(data.data));
        }

        statusText.textContent = "connected";
        statusText.parentElement.style.color = "var(--teal)";

    }
    catch(error){

        console.error(error);

        removeTyping();

        const row = document.createElement("div");
        row.className = "row bot";

        const bubble = document.createElement("div");
        bubble.className = "bubble error-message";
        bubble.textContent = "connection failed — make sure FastAPI and Ollama are running.";

        row.appendChild(buildLabel("bot"));
        row.appendChild(bubble);

        chatBox.appendChild(row);

        statusText.textContent = "offline";
        statusText.parentElement.style.color = "var(--red)";

    }

    sendButton.disabled = false;
    sendButton.textContent = "run";

    queryInput.focus();

    setTimeout(() => {

        if(statusText.textContent === "offline"){
            statusText.textContent = "connected";
            statusText.parentElement.style.color = "var(--teal)";
        }

    },3000);

}


/* =====================================================
   EVENTS
===================================================== */

sendButton.addEventListener("click", sendMessage);

queryInput.addEventListener("keydown", event => {

    if(event.key === "Enter"){
        event.preventDefault();
        sendMessage();
    }

});

queryInput.addEventListener("input", updateCounter);


document.addEventListener("keydown", event => {

    if(event.ctrlKey && event.key.toLowerCase() === "k"){
        event.preventDefault();
        queryInput.focus();
        queryInput.select();
    }

});


setTimeout(() => queryInput.focus(), 700);


</script>

</body>
</html>
