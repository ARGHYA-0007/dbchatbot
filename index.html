```html
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>pgchat — AI Database Console</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{

    --bg:#080b12;
    --bg2:#0d111a;

    --panel:rgba(18,23,34,.78);
    --panel2:rgba(24,30,43,.82);

    --border:rgba(255,255,255,.08);
    --border2:rgba(255,255,255,.05);

    --text:#e9edf5;
    --muted:#8b94a7;
    --faint:#515a6d;

    --accent:#e8a33d;
    --accent2:#ffbe5c;

    --green:#62e6a0;
    --red:#ff6f68;
    --blue:#65a9ff;

    --shadow:
        0 30px 80px rgba(0,0,0,.55),
        0 0 80px rgba(232,163,61,.04);

    --radius:14px;
}


/* =========================
   RESET
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{

    font-family:"Inter",sans-serif;

    background:
        radial-gradient(
            circle at 20% 0%,
            rgba(232,163,61,.08),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 90%,
            rgba(74,115,255,.07),
            transparent 35%
        ),
        var(--bg);

    color:var(--text);

    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:25px;

    overflow:hidden;
}


/* =========================
   BACKGROUND GRID
========================= */

.background-grid{

    position:fixed;

    inset:0;

    pointer-events:none;

    background-image:

        linear-gradient(
            rgba(255,255,255,.025) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(255,255,255,.025) 1px,
            transparent 1px
        );

    background-size:45px 45px;

    mask-image:
        radial-gradient(
            ellipse at center,
            black 20%,
            transparent 80%
        );

    animation:gridMove 25s linear infinite;
}

@keyframes gridMove{

    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(45px);
    }
}


/* =========================
   GLOW ORBS
========================= */

.orb{

    position:fixed;

    width:280px;
    height:280px;

    border-radius:50%;

    filter:blur(100px);

    opacity:.12;

    pointer-events:none;
}

.orb.one{

    background:#e8a33d;

    top:-130px;
    left:-100px;

    animation:orbOne 12s ease-in-out infinite alternate;
}

.orb.two{

    background:#536dff;

    right:-130px;
    bottom:-100px;

    animation:orbTwo 15s ease-in-out infinite alternate;
}

@keyframes orbOne{

    from{
        transform:translate(0,0);
    }

    to{
        transform:translate(100px,70px);
    }
}

@keyframes orbTwo{

    from{
        transform:translate(0,0);
    }

    to{
        transform:translate(-100px,-80px);
    }
}


/* =========================
   FLOATING PARTICLES
========================= */

.particles{

    position:fixed;

    inset:0;

    pointer-events:none;

    overflow:hidden;
}

.particle{

    position:absolute;

    width:2px;
    height:2px;

    background:rgba(255,255,255,.35);

    border-radius:50%;

    animation:floatParticle linear infinite;
}

@keyframes floatParticle{

    from{

        transform:
            translateY(110vh)
            translateX(0);

        opacity:0;

    }

    20%{
        opacity:1;
    }

    80%{
        opacity:1;
    }

    to{

        transform:
            translateY(-10vh)
            translateX(80px);

        opacity:0;
    }
}


/* =========================
   MAIN CONSOLE
========================= */

.console{

    position:relative;

    width:100%;
    max-width:1050px;

    height:min(760px,92vh);

    display:flex;
    flex-direction:column;

    background:var(--panel);

    border:1px solid var(--border);

    border-radius:var(--radius);

    backdrop-filter:blur(25px);

    box-shadow:var(--shadow);

    overflow:hidden;

    animation:consoleEnter .8s cubic-bezier(.16,1,.3,1);

}


/* animated border glow */

.console::before{

    content:"";

    position:absolute;

    inset:-1px;

    border-radius:inherit;

    padding:1px;

    background:
        linear-gradient(
            120deg,
            transparent,
            rgba(232,163,61,.35),
            transparent,
            rgba(100,130,255,.2),
            transparent
        );

    background-size:300% 300%;

    animation:borderFlow 8s linear infinite;

    pointer-events:none;

    mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);

    mask-composite:exclude;
}

@keyframes borderFlow{

    0%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0% 50%;
    }
}

@keyframes consoleEnter{

    from{

        opacity:0;

        transform:
            translateY(30px)
            scale(.97);

        filter:blur(8px);
    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);

        filter:blur(0);
    }
}


/* =========================
   HEADER
========================= */

.titlebar{

    height:68px;

    display:flex;
    align-items:center;

    padding:0 20px;

    background:rgba(255,255,255,.025);

    border-bottom:1px solid var(--border);

    flex-shrink:0;

    position:relative;

    z-index:2;
}


/* MAC DOTS */

.dots{

    display:flex;

    gap:8px;

    margin-right:15px;
}

.dots span{

    width:11px;
    height:11px;

    border-radius:50%;

    transition:
        transform .2s,
        box-shadow .2s;
}

.dots span:hover{

    transform:scale(1.35);
}

.dots .r{
    background:#ff625b;
    box-shadow:0 0 12px rgba(255,98,91,.4);
}

.dots .y{
    background:#ffc043;
    box-shadow:0 0 12px rgba(255,192,67,.4);
}

.dots .g{
    background:#32d74b;
    box-shadow:0 0 12px rgba(50,215,75,.4);
}


/* LOGO */

.logo{

    display:flex;

    align-items:center;

    gap:10px;
}

.logo-icon{

    width:32px;
    height:32px;

    display:grid;
    place-items:center;

    border-radius:9px;

    background:
        linear-gradient(
            135deg,
            rgba(232,163,61,.2),
            rgba(232,163,61,.05)
        );

    border:1px solid rgba(232,163,61,.25);

    color:var(--accent);

    font-family:"JetBrains Mono";

    font-weight:700;

    box-shadow:
        0 0 20px rgba(232,163,61,.08);

    animation:logoPulse 3s ease-in-out infinite;
}

@keyframes logoPulse{

    0%,100%{
        box-shadow:0 0 15px rgba(232,163,61,.05);
    }

    50%{
        box-shadow:0 0 25px rgba(232,163,61,.2);
    }
}

.title-meta{

    display:flex;

    flex-direction:column;

    gap:2px;
}

.name{

    font-family:"JetBrains Mono";

    font-weight:700;

    font-size:14px;

    letter-spacing:.2px;
}

.sub{

    color:var(--faint);

    font-size:10px;

    font-family:"JetBrains Mono";
}


/* =========================
   HEADER RIGHT
========================= */

.header-right{

    margin-left:auto;

    display:flex;

    align-items:center;

    gap:15px;
}

.latency{

    font-family:"JetBrains Mono";

    font-size:10px;

    color:var(--faint);
}

.status{

    display:flex;

    align-items:center;

    gap:7px;

    font-family:"JetBrains Mono";

    font-size:10px;

    color:var(--green);

    padding:6px 9px;

    border-radius:20px;

    background:rgba(98,230,160,.05);

    border:1px solid rgba(98,230,160,.12);
}

.status-dot{

    width:6px;
    height:6px;

    border-radius:50%;

    background:var(--green);

    box-shadow:0 0 0 0 rgba(98,230,160,.5);

    animation:statusPulse 2s infinite;
}

@keyframes statusPulse{

    0%{
        box-shadow:0 0 0 0 rgba(98,230,160,.5);
    }

    70%{
        box-shadow:0 0 0 7px rgba(98,230,160,0);
    }

    100%{
        box-shadow:0 0 0 0 rgba(98,230,160,0);
    }
}


/* =========================
   CHAT
========================= */

#chat-box{

    flex:1;

    overflow-y:auto;

    padding:25px;

    display:flex;

    flex-direction:column;

    gap:18px;

    scroll-behavior:smooth;
}


/* scrollbar */

#chat-box::-webkit-scrollbar{
    width:6px;
}

#chat-box::-webkit-scrollbar-thumb{

    background:rgba(255,255,255,.08);

    border-radius:20px;
}

#chat-box::-webkit-scrollbar-thumb:hover{

    background:rgba(232,163,61,.3);
}


/* =========================
   MESSAGE
========================= */

.row{

    max-width:88%;

    display:flex;

    flex-direction:column;

    animation:messageEnter .5s cubic-bezier(.16,1,.3,1);

}

@keyframes messageEnter{

    from{

        opacity:0;

        transform:
            translateY(15px)
            scale(.98);

        filter:blur(5px);
    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);

        filter:blur(0);
    }
}

.row.user{

    align-self:flex-end;

    align-items:flex-end;
}

.row.bot{

    align-self:flex-start;

    align-items:flex-start;
}


/* LABEL */

.label{

    font-family:"JetBrains Mono";

    font-size:9px;

    color:var(--faint);

    margin-bottom:6px;

    padding:0 3px;

    letter-spacing:.3px;
}


/* =========================
   BUBBLE
========================= */

.bubble{

    padding:12px 15px;

    border-radius:10px;

    line-height:1.6;

    font-size:13.5px;

    white-space:pre-wrap;

    word-break:break-word;

    position:relative;

    overflow:hidden;
}

.bubble::after{

    content:"";

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            100deg,
            transparent,
            rgba(255,255,255,.05),
            transparent
        );

    transform:translateX(-100%);

    animation:shine 4s ease-in-out infinite;
}

@keyframes shine{

    0%,70%{
        transform:translateX(-100%);
    }

    90%,100%{
        transform:translateX(100%);
    }
}


/* USER */

.row.user .bubble{

    background:
        linear-gradient(
            135deg,
            rgba(232,163,61,.18),
            rgba(232,163,61,.08)
        );

    border:1px solid rgba(232,163,61,.2);

    color:#f5dcae;

    font-family:"JetBrains Mono";

    font-size:12px;

    box-shadow:
        0 8px 25px rgba(0,0,0,.15);

    border-bottom-right-radius:3px;
}

.row.user .bubble::before{

    content:"> ";

    color:var(--accent);

    font-weight:bold;
}


/* BOT */

.row.bot .bubble{

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.045),
            rgba(255,255,255,.018)
        );

    border:1px solid var(--border);

    color:var(--text);

    border-top-left-radius:3px;

    box-shadow:
        0 8px 25px rgba(0,0,0,.12);
}


/* =========================
   WELCOME
========================= */

.welcome{

    margin:auto;

    text-align:center;

    max-width:600px;

    animation:welcomeIn 1s cubic-bezier(.16,1,.3,1);
}

@keyframes welcomeIn{

    from{

        opacity:0;

        transform:translateY(20px);
    }

    to{

        opacity:1;

        transform:translateY(0);
    }
}

.welcome-icon{

    width:60px;
    height:60px;

    margin:auto;

    display:grid;
    place-items:center;

    border-radius:18px;

    border:1px solid rgba(232,163,61,.2);

    background:rgba(232,163,61,.06);

    color:var(--accent);

    font-family:"JetBrains Mono";

    font-size:22px;

    box-shadow:
        0 0 40px rgba(232,163,61,.08);

    animation:welcomeFloat 4s ease-in-out infinite;
}

@keyframes welcomeFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-7px);
    }
}

.welcome h2{

    margin-top:18px;

    font-size:22px;

    font-weight:600;
}

.welcome p{

    margin-top:7px;

    color:var(--muted);

    font-size:12px;
}


/* =========================
   SUGGESTIONS
========================= */

.suggestions{

    display:flex;

    flex-wrap:wrap;

    justify-content:center;

    gap:8px;

    margin-top:20px;
}

.suggestion{

    border:1px solid var(--border);

    background:rgba(255,255,255,.025);

    color:var(--muted);

    padding:8px 11px;

    border-radius:20px;

    font-family:"JetBrains Mono";

    font-size:10px;

    cursor:pointer;

    transition:
        transform .2s,
        border-color .2s,
        background .2s,
        color .2s;
}

.suggestion:hover{

    transform:translateY(-3px);

    border-color:rgba(232,163,61,.3);

    background:rgba(232,163,61,.06);

    color:var(--accent);
}


/* =========================
   TYPING
========================= */

.typing{

    display:flex;

    align-items:center;

    gap:5px;

    padding:13px 15px;

    background:rgba(255,255,255,.035);

    border:1px solid var(--border);

    border-radius:10px;

    border-top-left-radius:3px;
}

.typing span{

    width:5px;
    height:5px;

    border-radius:50%;

    background:var(--accent);

    animation:typingBounce 1.1s infinite;
}

.typing span:nth-child(2){
    animation-delay:.15s;
}

.typing span:nth-child(3){
    animation-delay:.3s;
}

@keyframes typingBounce{

    0%,60%,100%{

        transform:translateY(0);

        opacity:.25;
    }

    30%{

        transform:translateY(-5px);

        opacity:1;
    }
}

.thinking-text{

    margin-left:6px;

    color:var(--faint);

    font-family:"JetBrains Mono";

    font-size:9px;
}


/* =========================
   TABLE
========================= */

.table-wrap{

    width:100%;

    min-width:500px;

    overflow:hidden;

    border-radius:10px;

    border:1px solid var(--border);

    background:rgba(10,14,21,.6);

    box-shadow:
        0 15px 40px rgba(0,0,0,.2);

    animation:tableAppear .6s cubic-bezier(.16,1,.3,1);
}

@keyframes tableAppear{

    from{

        opacity:0;

        transform:
            translateY(10px)
            scale(.98);
    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }
}


/* TABLE HEADER */

.table-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:9px 12px;

    background:rgba(255,255,255,.035);

    border-bottom:1px solid var(--border);

    font-family:"JetBrains Mono";

    font-size:9px;

    color:var(--muted);
}

.table-header-left{

    display:flex;

    align-items:center;

    gap:7px;
}

.table-icon{

    width:18px;
    height:18px;

    display:grid;
    place-items:center;

    border-radius:5px;

    background:rgba(232,163,61,.1);

    color:var(--accent);
}

.copy-btn{

    border:1px solid var(--border);

    background:transparent;

    color:var(--muted);

    padding:4px 8px;

    border-radius:5px;

    font-family:"JetBrains Mono";

    font-size:8px;

    cursor:pointer;

    transition:.2s;
}

.copy-btn:hover{

    color:var(--accent);

    border-color:rgba(232,163,61,.3);

    background:rgba(232,163,61,.05);
}


/* TABLE */

.table-scroll{

    overflow:auto;

    max-height:300px;
}

table{

    width:100%;

    border-collapse:collapse;

    font-family:"JetBrains Mono";

    font-size:11px;
}

thead th{

    text-align:left;

    padding:9px 12px;

    background:rgba(255,255,255,.025);

    color:var(--muted);

    font-weight:500;

    border-bottom:1px solid var(--border);

    position:sticky;

    top:0;

    backdrop-filter:blur(10px);
}

tbody td{

    padding:9px 12px;

    color:var(--text);

    border-bottom:1px solid var(--border2);

    white-space:nowrap;
}

tbody tr{

    transition:
        background .2s,
        transform .2s;
}

tbody tr:hover{

    background:rgba(232,163,61,.055);

    transform:translateX(3px);
}

tbody tr{

    animation:rowReveal .35s ease both;
}

@keyframes rowReveal{

    from{

        opacity:0;

        transform:translateX(-8px);
    }

    to{

        opacity:1;

        transform:translateX(0);
    }
}


/* =========================
   INPUT AREA
========================= */

.input-container{

    padding:14px 18px 17px;

    background:rgba(255,255,255,.025);

    border-top:1px solid var(--border);

    flex-shrink:0;
}

.input-area{

    display:flex;

    align-items:center;

    gap:10px;

    padding:4px 5px 4px 13px;

    border:1px solid var(--border);

    border-radius:10px;

    background:rgba(0,0,0,.18);

    transition:
        border-color .25s,
        box-shadow .25s,
        background .25s;
}

.input-area:focus-within{

    border-color:rgba(232,163,61,.35);

    background:rgba(232,163,61,.025);

    box-shadow:
        0 0 0 3px rgba(232,163,61,.05),
        0 0 30px rgba(232,163,61,.05);
}

.prompt-glyph{

    font-family:"JetBrains Mono";

    color:var(--accent);

    font-size:16px;

    animation:promptBlink 1.5s infinite;
}

@keyframes promptBlink{

    0%,100%{
        opacity:1;
    }

    50%{
        opacity:.45;
    }
}

#query{

    flex:1;

    min-width:0;

    background:transparent;

    border:none;

    outline:none;

    color:var(--text);

    font-family:"JetBrains Mono";

    font-size:12px;

    padding:10px 0;
}

#query::placeholder{

    color:var(--faint);
}


/* =========================
   SEND BUTTON
========================= */

#send-btn{

    position:relative;

    overflow:hidden;

    border:1px solid rgba(232,163,61,.35);

    border-radius:7px;

    padding:9px 16px;

    background:rgba(232,163,61,.08);

    color:var(--accent);

    font-family:"JetBrains Mono";

    font-size:10px;

    font-weight:600;

    cursor:pointer;

    transition:
        transform .2s,
        background .2s,
        color .2s,
        box-shadow .2s;
}

#send-btn::before{

    content:"";

    position:absolute;

    top:0;

    left:-100%;

    width:100%;

    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.18),
            transparent
        );

    transition:.5s;
}

#send-btn:hover::before{

    left:100%;
}

#send-btn:hover:not(:disabled){

    transform:translateY(-2px);

    background:var(--accent);

    color:#171006;

    box-shadow:
        0 8px 25px rgba(232,163,61,.2);
}

#send-btn:active:not(:disabled){

    transform:translateY(0) scale(.96);
}

#send-btn:disabled{

    opacity:.4;

    cursor:not-allowed;
}


/* =========================
   FOOTER INFO
========================= */

.input-footer{

    display:flex;

    justify-content:space-between;

    margin-top:7px;

    padding:0 4px;

    color:var(--faint);

    font-family:"JetBrains Mono";

    font-size:8px;
}

.input-footer span{

    display:flex;

    align-items:center;

    gap:5px;
}


/* =========================
   ERROR
========================= */

.error-message{

    border-color:rgba(255,111,104,.25) !important;

    animation:errorShake .4s ease;
}

@keyframes errorShake{

    0%,100%{
        transform:translateX(0);
    }

    25%{
        transform:translateX(-5px);
    }

    75%{
        transform:translateX(5px);
    }
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    body{
        padding:0;
    }

    .console{

        height:100vh;

        max-width:none;

        border-radius:0;

        border:none;
    }

    .latency{
        display:none;
    }

    .sub{
        display:none;
    }

    #chat-box{
        padding:18px;
    }

    .row{
        max-width:94%;
    }

    .table-wrap{
        min-width:0;
        max-width:100%;
    }

    .welcome h2{
        font-size:19px;
    }

    .suggestions{
        padding:0 10px;
    }

    .input-container{
        padding:10px;
    }

}


/* =========================
   REDUCED MOTION
========================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{

        animation:none !important;

        transition:none !important;

        scroll-behavior:auto !important;
    }
}

</style>

</head>


<body>


<!-- BACKGROUND -->

<div class="background-grid"></div>

<div class="orb one"></div>
<div class="orb two"></div>

<div class="particles" id="particles"></div>


<!-- MAIN CONSOLE -->

<div class="console">


    <!-- HEADER -->

    <div class="titlebar">

        <div class="dots">

            <span class="r"></span>
            <span class="y"></span>
            <span class="g"></span>

        </div>


        <div class="logo">

            <div class="logo-icon">
                DB
            </div>

            <div class="title-meta">

                <span class="name">
                    pgchat
                </span>

                <span class="sub">
                    natural language → PostgreSQL
                </span>

            </div>

        </div>


        <div class="header-right">

            <span
                class="latency"
                id="latency"
            >
                ready
            </span>


            <div class="status">

                <span class="status-dot"></span>

                <span id="statusText">
                    connected
                </span>

            </div>

        </div>

    </div>



    <!-- CHAT -->

    <div id="chat-box">


        <!-- WELCOME -->

        <div
            class="welcome"
            id="welcome"
        >

            <div class="welcome-icon">
                ⌘
            </div>

            <h2>
                Ask your database
            </h2>

            <p>
                Query PostgreSQL using natural language.
            </p>


            <div class="suggestions">

                <button
                    class="suggestion"
                    onclick="useSuggestion('get all students')"
                >
                    get all students
                </button>

                <button
                    class="suggestion"
                    onclick="useSuggestion('show students older than 18')"
                >
                    students older than 18
                </button>

                <button
                    class="suggestion"
                    onclick="useSuggestion('count all students')"
                >
                    count students
                </button>

                <button
                    class="suggestion"
                    onclick="useSuggestion('show all branches')"
                >
                    show branches
                </button>

            </div>

        </div>


    </div>



    <!-- INPUT -->

    <div class="input-container">

        <div class="input-area">

            <span class="prompt-glyph">
                ›
            </span>


            <input
                type="text"
                id="query"
                placeholder="ask a question..."
                autocomplete="off"
                maxlength="500"
            >


            <button
                id="send-btn"
            >
                run
            </button>

        </div>


        <div class="input-footer">

            <span>
                <span>↵</span>
                enter to run
            </span>

            <span id="charCount">
                0 / 500
            </span>

        </div>

    </div>


</div>



<script>


/* =====================================================
   ELEMENTS
===================================================== */

const queryInput =
    document.getElementById("query");

const sendButton =
    document.getElementById("send-btn");

const chatBox =
    document.getElementById("chat-box");

const latencyElement =
    document.getElementById("latency");

const statusText =
    document.getElementById("statusText");

const charCount =
    document.getElementById("charCount");

const welcome =
    document.getElementById("welcome");


/* =====================================================
   PARTICLES
===================================================== */

const particles =
    document.getElementById("particles");


for(let i = 0; i < 45; i++){

    const particle =
        document.createElement("div");

    particle.className =
        "particle";

    particle.style.left =
        Math.random() * 100 + "%";

    particle.style.animationDuration =
        (8 + Math.random() * 15) + "s";

    particle.style.animationDelay =
        (-Math.random() * 15) + "s";

    particle.style.opacity =
        Math.random();

    particles.appendChild(particle);
}


/* =====================================================
   TIME
===================================================== */

function timeNow(){

    return new Date().toLocaleTimeString(
        [],
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* =====================================================
   HIDE WELCOME
===================================================== */

function hideWelcome(){

    if(welcome){

        welcome.style.opacity = "0";

        welcome.style.transform =
            "translateY(-10px) scale(.98)";

        welcome.style.pointerEvents =
            "none";

        setTimeout(() => {

            welcome.remove();

        },300);

    }

}


/* =====================================================
   ADD MESSAGE
===================================================== */

function addMessage(message,type){

    hideWelcome();


    const row =
        document.createElement("div");

    row.className =
        `row ${type}`;


    const label =
        document.createElement("span");

    label.className =
        "label";

    label.textContent =
        `${type === "user" ? "you" : "pgchat"} · ${timeNow()}`;


    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    bubble.textContent =
        message;


    row.appendChild(label);

    row.appendChild(bubble);

    chatBox.appendChild(row);


    scrollToBottom();

}


/* =====================================================
   STREAM BOT MESSAGE
===================================================== */

async function streamMessage(message){

    hideWelcome();


    const row =
        document.createElement("div");

    row.className =
        "row bot";


    const label =
        document.createElement("span");

    label.className =
        "label";

    label.textContent =
        `pgchat · ${timeNow()}`;


    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";


    row.appendChild(label);

    row.appendChild(bubble);

    chatBox.appendChild(row);


    let text = "";

    for(const char of message){

        text += char;

        bubble.textContent =
            text;

        scrollToBottom();

        await new Promise(
            resolve =>
                setTimeout(resolve,8)
        );

    }

}


/* =====================================================
   TYPING
===================================================== */

function showTyping(){

    const row =
        document.createElement("div");

    row.className =
        "row bot";

    row.id =
        "typing-row";


    const label =
        document.createElement("span");

    label.className =
        "label";

    label.textContent =
        "pgchat · processing";


    const typing =
        document.createElement("div");

    typing.className =
        "typing";


    typing.innerHTML = `

        <span></span>
        <span></span>
        <span></span>

        <span class="thinking-text">
            querying database
        </span>

    `;


    row.appendChild(label);

    row.appendChild(typing);


    chatBox.appendChild(row);

    scrollToBottom();

}


/* =====================================================
   REMOVE TYPING
===================================================== */

function removeTyping(){

    const typing =
        document.getElementById(
            "typing-row"
        );

    if(typing){

        typing.style.opacity = "0";

        typing.style.transform =
            "translateY(-5px)";

        setTimeout(
            () => typing.remove(),
            150
        );

    }

}


/* =====================================================
   TABLE
===================================================== */

function createTable(students){

    hideWelcome();


    const row =
        document.createElement("div");

    row.className =
        "row bot";


    const label =
        document.createElement("span");

    label.className =
        "label";

    label.textContent =
        `pgchat · ${timeNow()}`;


    const wrap =
        document.createElement("div");

    wrap.className =
        "table-wrap";


    /* HEADER */

    const header =
        document.createElement("div");

    header.className =
        "table-header";


    const left =
        document.createElement("div");

    left.className =
        "table-header-left";


    const icon =
        document.createElement("div");

    icon.className =
        "table-icon";

    icon.textContent =
        "▦";


    const title =
        document.createElement("span");

    title.textContent =
        "query result";


    left.appendChild(icon);

    left.appendChild(title);


    const right =
        document.createElement("div");

    right.style.display =
        "flex";

    right.style.alignItems =
        "center";

    right.style.gap =
        "8px";


    const count =
        document.createElement("span");

    count.textContent =
        `${students.length} row${students.length === 1 ? "" : "s"}`;


    const copyButton =
        document.createElement("button");

    copyButton.className =
        "copy-btn";

    copyButton.textContent =
        "copy";


    copyButton.onclick =
        () => copyTable(students,copyButton);


    right.appendChild(count);

    right.appendChild(copyButton);


    header.appendChild(left);

    header.appendChild(right);


    /* TABLE */

    const scroll =
        document.createElement("div");

    scroll.className =
        "table-scroll";


    const table =
        document.createElement("table");


    table.innerHTML = `

        <thead>

            <tr>

                <th>id</th>
                <th>name</th>
                <th>age</th>
                <th>branch</th>

            </tr>

        </thead>

        <tbody></tbody>

    `;


    const tbody =
        table.querySelector("tbody");


    students.forEach(
        (student,index) => {

            const tr =
                document.createElement("tr");

            tr.style.animationDelay =
                `${index * 45}ms`;


            tr.innerHTML = `

                <td>${escapeHTML(student.id)}</td>

                <td>${escapeHTML(student.name)}</td>

                <td>${escapeHTML(student.age)}</td>

                <td>${escapeHTML(student.branch)}</td>

            `;


            tbody.appendChild(tr);

        }
    );


    scroll.appendChild(table);


    wrap.appendChild(header);

    wrap.appendChild(scroll);


    row.appendChild(label);

    row.appendChild(wrap);


    chatBox.appendChild(row);


    scrollToBottom();

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    const div =
        document.createElement("div");

    div.textContent =
        value ?? "";

    return div.innerHTML;

}


/* =====================================================
   COPY TABLE
===================================================== */

async function copyTable(
    students,
    button
){

    const text =
        students.map(
            student =>
                `${student.id}\t${student.name}\t${student.age}\t${student.branch}`
        ).join("\n");


    try{

        await navigator.clipboard.writeText(text);

        button.textContent =
            "copied ✓";


        setTimeout(
            () => {
                button.textContent =
                    "copy";
            },
            1500
        );

    }
    catch(error){

        button.textContent =
            "failed";

    }

}


/* =====================================================
   SCROLL
===================================================== */

function scrollToBottom(){

    requestAnimationFrame(() => {

        chatBox.scrollTo({

            top:
                chatBox.scrollHeight,

            behavior:
                "smooth"

        });

    });

}


/* =====================================================
   SUGGESTION
===================================================== */

function useSuggestion(text){

    queryInput.value =
        text;

    updateCounter();

    queryInput.focus();

    sendMessage();

}


/* =====================================================
   COUNTER
===================================================== */

function updateCounter(){

    charCount.textContent =
        `${queryInput.value.length} / 500`;

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

    const query =
        queryInput.value.trim();


    if(!query){

        queryInput.focus();

        return;

    }


    addMessage(
        query,
        "user"
    );


    queryInput.value =
        "";

    updateCounter();


    sendButton.disabled =
        true;

    sendButton.textContent =
        "running";


    const startTime =
        performance.now();


    showTyping();


    statusText.textContent =
        "querying";


    statusText.parentElement.style.color =
        "var(--accent)";


    try{

        const response =
            await fetch(

                `http://127.0.0.1:8000/predict?query=${encodeURIComponent(query)}`,

                {
                    method:"POST"
                }

            );


        if(!response.ok){

            throw new Error(
                `Server returned ${response.status}`
            );

        }


        const data =
            await response.json();


        const endTime =
            performance.now();


        const elapsed =
            Math.round(
                endTime - startTime
            );


        latencyElement.textContent =
            `${elapsed} ms`;


        removeTyping();


        if(data.type === "table"){

            createTable(
                data.data
            );

        }
        else{

            await streamMessage(
                String(data.data)
            );

        }


        statusText.textContent =
            "connected";

        statusText.parentElement.style.color =
            "var(--green)";


    }
    catch(error){

        console.error(error);


        removeTyping();


        const row =
            document.createElement("div");

        row.className =
            "row bot";


        const label =
            document.createElement("span");

        label.className =
            "label";

        label.textContent =
            `pgchat · error`;


        const bubble =
            document.createElement("div");

        bubble.className =
            "bubble error-message";

        bubble.textContent =
            "connection failed — make sure FastAPI and Ollama are running.";


        row.appendChild(label);

        row.appendChild(bubble);

        chatBox.appendChild(row);


        statusText.textContent =
            "offline";

        statusText.parentElement.style.color =
            "var(--red)";

    }


    sendButton.disabled =
        false;

    sendButton.textContent =
        "run";


    queryInput.focus();


    setTimeout(() => {

        if(
            statusText.textContent ===
            "offline"
        ){

            statusText.textContent =
                "connected";

            statusText.parentElement.style.color =
                "var(--green)";

        }

    },3000);

}


/* =====================================================
   EVENTS
===================================================== */

sendButton.addEventListener(
    "click",
    sendMessage
);


queryInput.addEventListener(
    "keydown",
    event => {

        if(event.key === "Enter"){

            event.preventDefault();

            sendMessage();

        }

    }
);


queryInput.addEventListener(
    "input",
    updateCounter
);


/* =====================================================
   CTRL + K
===================================================== */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.ctrlKey &&
            event.key.toLowerCase() === "k"
        ){

            event.preventDefault();

            queryInput.focus();

            queryInput.select();

        }

    }
);


/* =====================================================
   INITIAL FOCUS
===================================================== */

setTimeout(
    () => queryInput.focus(),
    700
);


</script>

</body>
</html>
```
